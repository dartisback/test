# ===============================================================
#  C.E.D ITA - RISORSE E IMPOSTAZIONI
#  Caricato da server.cfg (exec risorse.cfg). Si aggiorna in automatico:
#  se cambi un valore qui, l'aggiornamento conserva la tua riga.
# ===============================================================

# ---------------------------------------------------------------
#  LINGUA
# ---------------------------------------------------------------
setr esx:locale "it"
setr ox:locale "it"
setr ox:primaryColor "blue"
setr ox:primaryShade 7
setr illenium-appearance:locale "it"

# ---------------------------------------------------------------
#  OX_INVENTORY
# ---------------------------------------------------------------
setr inventory:framework "esx"
setr inventory:slots 50
setr inventory:weight 30000
setr inventory:police ["polizia", "carabinieri"]
setr inventory:evidencegrade 0
setr inventory:screenblur true
setr inventory:keys ["F2", "K", "TAB"]
setr inventory:weaponanims true
setr inventory:itemnotify true

# ---------------------------------------------------------------
#  CHAT / VOCE
# ---------------------------------------------------------------
set resources_useSystemChat true
setr voice_enableUi 0
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr voice_enableRadioAnim 1
setr voice_defaultRadio "LMENU"

# ---------------------------------------------------------------
#  RISORSE DI SISTEMA (incluse negli artifacts)
# ---------------------------------------------------------------
ensure chat
ensure hardcap
ensure spawnmanager

# voce di prossimita' e radio
ensure pma-voice

# ---------------------------------------------------------------
#  LIBRERIE OVEREXTENDED (gia' incluse; aggiornabili con INSTALLA_RISORSE.bat -Aggiorna)
# ---------------------------------------------------------------
ensure oxmysql
ensure ced_database
ensure cfxlua-require
ensure ox_lib

# ---------------------------------------------------------------
#  ESX LEGACY (l'ordine conta!)
# ---------------------------------------------------------------
ensure esx_lib
ensure es_extended
ensure ox_inventory
ensure cron
ensure esx_chat_theme
ensure esx_notify
ensure esx_textui
ensure esx_progressbar
ensure esx_context
ensure esx_menu_default
ensure esx_menu_dialog
ensure esx_menu_list
ensure esx_loadingscreen

# ---------------------------------------------------------------
#  ASPETTO + PERSONAGGI (al posto di esx_skin / skinchanger / esx_identity / esx_multicharacter)
# ---------------------------------------------------------------
ensure illenium-appearance
ensure ced_personaggi

# ---------------------------------------------------------------
#  C.E.D ITA - FORZE DELL'ORDINE
# ---------------------------------------------------------------
ensure ced_forzeordine
ensure ced_radio

# ---------------------------------------------------------------
#  FIVEPD
# ---------------------------------------------------------------
# Estrai FivePD in resources/[fivepd]/fivepd  (vedi LEGGIMI.txt in quella cartella).
# Finche' la cartella non c'e' vedrai solo l'avviso "Couldn't find resource fivepd": e' normale.
ensure fivepd

