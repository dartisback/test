#
#  C.E.D ITA - ESX Legacy + ox_inventory + FivePD
#  Job: Polizia Di Stato - Operatore / Arma Dei Carabinieri - Operatore
#
#  Le righe che iniziano con # sono commenti e vengono ignorate.
#
#  Questo file contiene SOLO le tue impostazioni (key, nome, database...).
#  L'elenco delle risorse e' in risorse.cfg e si aggiorna da solo.

# ---------------------------------------------------------------
#  RETE
# ---------------------------------------------------------------
# Cambia solo la porta se ti serve (30120 e' quella standard).
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_endpointPrivacy true

# ---------------------------------------------------------------
#  LICENZA (KEYMASTER)
# ---------------------------------------------------------------
# Generala su https://keymaster.fivem.net e incollala tra le virgolette.
sv_licenseKey "INSERISCI_QUI_LA_TUA_KEY"

# ---------------------------------------------------------------
#  INFORMAZIONI SERVER
# ---------------------------------------------------------------
sv_hostname "^4C.E.D ^7ITA ^1| ^7Roleplay Forze dell'Ordine ^2[ESX + FivePD]"
sets sv_projectName "C.E.D ITA"
sets sv_projectDesc "Roleplay italiano: Polizia Di Stato e Arma Dei Carabinieri"
sets tags "italia, ita, italiano, roleplay, esx, fivepd, polizia, carabinieri"
sets locale "it-IT"
# sets banner_detail "https://link-alla-tua-immagine/banner.png"
# sets banner_connecting "https://link-alla-tua-immagine/banner.png"
# load_server_icon logo.png   # PNG 96x96 nella cartella server-data

# Massimo 48 slot senza abbonamento Element Club.
sv_maxclients 32

set steam_webApiKey "none"
sv_enforceGameBuild 3258
set onesync on

# ---------------------------------------------------------------
#  DATABASE (MySQL / MariaDB)
# ---------------------------------------------------------------
# Il database (nome qui sotto, ced_ita) si crea con CREA_DATABASE.bat o AVVIA_SERVER.bat.
# Le tabelle nuove e i job (Disoccupato, Polizia Di Stato - Operatore,
# Arma Dei Carabinieri - Operatore) vengono controllati a ogni avvio dal server stesso.
# Default per XAMPP in locale: utente root senza password.
# Se hai messo una password:  mysql://root:LATUAPASSWORD@localhost/ced_ita?charset=utf8mb4
# Per cambiare nome al database cambia solo "ced_ita" qui sotto.
set mysql_connection_string "mysql://root@localhost/ced_ita?charset=utf8mb4"
set mysql_ui true

# ---------------------------------------------------------------
#  AGGIORNAMENTO AUTOMATICO C.E.D ITA
# ---------------------------------------------------------------
# Deve stare PRIMA di tutte le altre risorse: all'avvio scarica da GitHub le
# novita' (tiene key, database e le tue modifiche), poi il server continua.
# Per disattivarlo crea il file NON_AGGIORNARE.txt nella cartella principale.
ensure ced_aggiornamenti
refresh

# ---------------------------------------------------------------
#  RISORSE E IMPOSTAZIONI C.E.D ITA (si aggiornano da sole)
# ---------------------------------------------------------------
exec risorse.cfg

# ---------------------------------------------------------------
#  PERMESSI (admin, ox_lib, ESX, gruppi FivePD)
# ---------------------------------------------------------------
exec permessi.cfg
