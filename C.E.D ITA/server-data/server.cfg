#
#  C.E.D ITA - ESX Legacy + ox_inventory + FivePD
#  Job: Polizia Di Stato - Operatore / Arma Dei Carabinieri - Operatore
#
#  Le righe che iniziano con # sono commenti e vengono ignorate.

# ---------------------------------------------------------------
#  RETE
# ---------------------------------------------------------------
# Cambia solo la porta se ti serve (30120 e' quella standard).
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_endpointPrivacy true

# ---------------------------------------------------------------
#  LICENZA (KEYMASTER)
# ---------------------------------------------------------------
# Generala su https://keymaster.fivem.net e incollala tra le virgolette.
sv_licenseKey "INSERISCI_QUI_LA_TUA_KEY"

# ---------------------------------------------------------------
#  INFORMAZIONI SERVER
# ---------------------------------------------------------------
sv_hostname "^4C.E.D ^7ITA ^1| ^7Roleplay Forze dell'Ordine ^2[ESX + FivePD]"
sets sv_projectName "C.E.D ITA"
sets sv_projectDesc "Roleplay italiano: Polizia Di Stato e Arma Dei Carabinieri"
sets tags "italia, ita, italiano, roleplay, esx, fivepd, polizia, carabinieri"
sets locale "it-IT"
# sets banner_detail "https://link-alla-tua-immagine/banner.png"
# sets banner_connecting "https://link-alla-tua-immagine/banner.png"
# load_server_icon logo.png   # PNG 96x96 nella cartella server-data

# Massimo 48 slot senza abbonamento Element Club.
sv_maxclients 32

set steam_webApiKey "none"
sv_enforceGameBuild 3095
set onesync on

# ---------------------------------------------------------------
#  DATABASE (MySQL / MariaDB)
# ---------------------------------------------------------------
# Il database viene CREATO DA SOLO all'avvio (AVVIA_SERVER.bat / CREA_DATABASE.bat)
# con il nome scritto qui sotto (ced_ita), insieme alle tabelle e ai job:
#   Disoccupato, Polizia Di Stato - Operatore, Arma Dei Carabinieri - Operatore
# Default per XAMPP in locale: utente root senza password.
# Se hai messo una password:  mysql://root:LATUAPASSWORD@localhost/ced_ita?charset=utf8mb4
# Per cambiare nome al database cambia solo "ced_ita" qui sotto.
set mysql_connection_string "mysql://root@localhost/ced_ita?charset=utf8mb4"
set mysql_ui true

# ---------------------------------------------------------------
#  LINGUA
# ---------------------------------------------------------------
setr esx:locale "it"
setr ox:locale "it"
setr ox:primaryColor "blue"
setr ox:primaryShade 7
setr illenium-appearance:locale "it"

# ---------------------------------------------------------------
#  OX_INVENTORY
# ---------------------------------------------------------------
setr inventory:framework "esx"
setr inventory:slots 50
setr inventory:weight 30000
setr inventory:police ["polizia", "carabinieri"]
setr inventory:evidencegrade 0
setr inventory:screenblur true
setr inventory:keys ["F2", "K", "TAB"]
setr inventory:weaponanims true
setr inventory:itemnotify true

# ---------------------------------------------------------------
#  CHAT / VOCE
# ---------------------------------------------------------------
set resources_useSystemChat true
setr voice_enableUi 0

# ---------------------------------------------------------------
#  RISORSE DI SISTEMA (incluse negli artifacts)
# ---------------------------------------------------------------
ensure chat
ensure hardcap
ensure spawnmanager

# ---------------------------------------------------------------
#  LIBRERIE OVEREXTENDED (gia' incluse; aggiornabili con INSTALLA_RISORSE.bat -Aggiorna)
# ---------------------------------------------------------------
ensure oxmysql
ensure cfxlua-require
ensure ox_lib

# ---------------------------------------------------------------
#  ESX LEGACY (l'ordine conta!)
# ---------------------------------------------------------------
ensure esx_lib
ensure es_extended
ensure ox_inventory
ensure cron
ensure esx_chat_theme
ensure esx_notify
ensure esx_textui
ensure esx_progressbar
ensure esx_context
ensure esx_menu_default
ensure esx_menu_dialog
ensure esx_menu_list
ensure esx_loadingscreen

# ---------------------------------------------------------------
#  ASPETTO + PERSONAGGI (al posto di esx_skin / skinchanger / esx_identity / esx_multicharacter)
# ---------------------------------------------------------------
ensure illenium-appearance
ensure ced_personaggi

# ---------------------------------------------------------------
#  C.E.D ITA - FORZE DELL'ORDINE
# ---------------------------------------------------------------
ensure ced_forzeordine

# ---------------------------------------------------------------
#  FIVEPD
# ---------------------------------------------------------------
# Estrai FivePD in resources/[fivepd]/fivepd  (vedi LEGGIMI.txt in quella cartella).
# Finche' la cartella non c'e' vedrai solo l'avviso "Couldn't find resource fivepd": e' normale.
ensure fivepd

# ---------------------------------------------------------------
#  PERMESSI (admin, ox_lib, ESX, gruppi FivePD)
# ---------------------------------------------------------------
exec permessi.cfg
