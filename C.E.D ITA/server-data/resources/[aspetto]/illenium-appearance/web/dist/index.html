<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C.E.D ITA - Aspetto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <script type="module" crossorigin src="./assets/index.b8e72b46.js"></script>
    <!-- C.E.D ITA: intestazione e sfumatura, visibili solo con il menu aperto -->
    <style>
      body.ced-aperto::before {
        content: ""; position: fixed; inset: 0 auto 0 0; width: 520px; pointer-events: none;
        background: linear-gradient(90deg, rgba(5, 8, 18, 0.62), rgba(5, 8, 18, 0));
      }
      #ced-intestazione {
        position: fixed; top: 28px; right: 32px; display: none; align-items: center; gap: 14px;
        padding: 12px 18px 12px 14px; border-radius: 14px; pointer-events: none;
        background: rgba(12, 17, 30, 0.82); border: 1px solid rgba(148, 178, 255, 0.14);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45); font-family: Inter, "Segoe UI", sans-serif; color: #e8eefc;
        animation: ced-entra 420ms cubic-bezier(0.2, 0.9, 0.3, 1) both;
      }
      body.ced-aperto #ced-intestazione { display: flex; }
      #ced-intestazione .bandiera { display: flex; width: 8px; height: 38px; flex-direction: column; border-radius: 3px; overflow: hidden; }
      #ced-intestazione .bandiera i { flex: 1; }
      #ced-intestazione .bandiera i:nth-child(1) { background: #009246; }
      #ced-intestazione .bandiera i:nth-child(2) { background: #f1f2f1; }
      #ced-intestazione .bandiera i:nth-child(3) { background: #ce2b37; }
      #ced-intestazione b { display: block; font-size: 15px; letter-spacing: 0.12em; }
      #ced-intestazione span { display: block; font-size: 12px; color: rgba(208, 220, 245, 0.7); margin-top: 2px; }
      @keyframes ced-entra { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
    </style>
</head>

<body>
    <div id="root"></div>
    <div id="ced-intestazione"><div class="bandiera"><i></i><i></i><i></i></div><div><b>C.E.D ITA</b><span>Personalizza il tuo cittadino</span></div></div>
    <script>
      window.addEventListener("message", function (e) {
        var t = e.data && e.data.type;
        if (t === "appearance_display") document.body.classList.add("ced-aperto");
        if (t === "appearance_hide") document.body.classList.remove("ced-aperto");
      });
    </script>

    
</body>

</html>
