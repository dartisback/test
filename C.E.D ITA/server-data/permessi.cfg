# ===============================================================
#  C.E.D ITA - PERMESSI
# ===============================================================

# ---------------------------------------------------------------
#  AMMINISTRATORI
# ---------------------------------------------------------------
# Metti il tuo identificativo al posto di XXXXXXXX e togli il # davanti.
# Lo trovi nella console del server quando entri, oppure su txAdmin.
# add_principal identifier.fivem:XXXXXXXX group.admin
# add_principal identifier.license:XXXXXXXX group.admin
#
# In alternativa, quando sei in gioco, scrivi nella CONSOLE del server:
#   setgroup <id-giocatore> admin

add_principal group.admin group.user
add_ace group.admin command allow
add_ace group.admin command.quit deny

# ---------------------------------------------------------------
#  RISORSE CHE GESTISCONO PERMESSI DA SOLE
# ---------------------------------------------------------------
add_ace resource.es_extended command.add_ace allow
add_ace resource.es_extended command.add_principal allow
add_ace resource.es_extended command.remove_principal allow
add_ace resource.es_extended command.stop allow

add_ace resource.ox_lib command.add_ace allow
add_ace resource.ox_lib command.remove_ace allow
add_ace resource.ox_lib command.add_principal allow
add_ace resource.ox_lib command.remove_principal allow

# ced_forzeordine assegna/toglie i gruppi Polizia e Carabinieri in base al job ESX.
add_ace resource.ced_forzeordine command.add_principal allow
add_ace resource.ced_forzeordine command.remove_principal allow

# ---------------------------------------------------------------
#  GRUPPI FORZE DELL'ORDINE (usati per FivePD)
# ---------------------------------------------------------------
# Chi ha il job "polizia" riceve group.polizia, chi ha "carabinieri" riceve group.carabinieri.
# Entrambi ereditano group.forzeordine.
add_principal group.polizia group.forzeordine
add_principal group.carabinieri group.forzeordine
add_ace group.forzeordine fivepd allow
add_ace group.polizia fivepd.polizia allow
add_ace group.carabinieri fivepd.carabinieri allow

# Gli admin hanno sempre accesso a FivePD.
add_ace group.admin fivepd allow
