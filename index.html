<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next Rome Roleplay</title>
<style>
  :root {
    --green: #009246;
    --white: #f4f5f0;
    --red: #ce2b37;
    --bg: #05070d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at center, #0f1626 0%, var(--bg) 70%);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: min(92vw, 640px);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  /* alone tricolore dietro il logo */
  .aura {
    position: absolute;
    width: 62%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: conic-gradient(var(--green), var(--white), var(--red), var(--green));
    filter: blur(60px);
    opacity: .35;
    animation: spin 9s linear infinite, pulse 3s ease-in-out infinite;
  }
  .logo {
    position: relative;
    width: 56%;
    height: auto;
    animation: float 4s ease-in-out infinite, glow 3s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-14px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .6; } }
  @keyframes glow {
    0%, 100% { filter: drop-shadow(0 0 10px var(--green)) drop-shadow(0 0 22px rgba(0,146,70,.6)); }
    33%      { filter: drop-shadow(0 0 10px var(--white)) drop-shadow(0 0 22px rgba(244,245,240,.6)); }
    66%      { filter: drop-shadow(0 0 10px var(--red))   drop-shadow(0 0 22px rgba(206,43,55,.6)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo, .aura { animation: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="aura"></div>
  <canvas id="fx"></canvas>
  <img class="logo" src="logo.png" alt="Next Rome Roleplay">
</div>

<script>
(() => {
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  const COLORS = ['#00c25f', '#ffffff', '#ff3b4a']; // verde, bianco, rosso
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, dpr;

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();

  // fulmine a spezzata con spostamento del punto medio
  function bolt(x1, y1, x2, y2, disp, out = []) {
    if (disp < 3) { out.push([x2, y2]); return out; }
    const mx = (x1 + x2) / 2 + (Math.random() - .5) * disp;
    const my = (y1 + y2) / 2 + (Math.random() - .5) * disp;
    bolt(x1, y1, mx, my, disp / 2, out);
    bolt(mx, my, x2, y2, disp / 2, out);
    return out;
  }

  function drawPath(pts, color, width, alpha) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
    ctx.stroke();
  }

  const arcs = [];
  function spawn() {
    const cx = W / 2, cy = H / 2;
    const a = Math.random() * Math.PI * 2;
    const r1 = W * (0.20 + Math.random() * 0.06);
    const r2 = W * (0.36 + Math.random() * 0.12);
    const a2 = a + (Math.random() - .5) * 0.9;
    const x1 = cx + Math.cos(a) * r1,  y1 = cy + Math.sin(a) * r1 * 1.05;
    const x2 = cx + Math.cos(a2) * r2, y2 = cy + Math.sin(a2) * r2;
    const pts = bolt(x1, y1, x2, y2, W * 0.12, [[x1, y1]]);
    // ramo secondario
    const k = Math.floor(pts.length * (.3 + Math.random() * .4));
    const [bx, by] = pts[k];
    const ba = a2 + (Math.random() - .5) * 1.6;
    const branch = bolt(bx, by, bx + Math.cos(ba) * W * .1, by + Math.sin(ba) * W * .1, W * .06, [[bx, by]]);
    arcs.push({ pts, branch, color: COLORS[(Math.random() * 3) | 0], life: 1, decay: .03 + Math.random() * .04 });
  }

  let last = 0, acc = 0;
  function frame(t) {
    const dt = Math.min(t - last, 50); last = t; acc += dt;
    ctx.clearRect(0, 0, W, H);
    ctx.shadowBlur = 0;

    // nuovo fulmine ogni ~70-140ms
    if (acc > 40 + Math.random() * 50) { acc = 0; spawn(); spawn(); if (Math.random() < .5) spawn(); }

    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (let i = arcs.length - 1; i >= 0; i--) {
      const s = arcs[i];
      drawPath(s.pts, s.color, 6, s.life * .6);       // bagliore
      drawPath(s.pts, '#fff', 2.2, s.life);               // nucleo
      drawPath(s.branch, s.color, 2.6, s.life * .85);
      s.life -= s.decay * (dt / 16);
      if (s.life <= 0) arcs.splice(i, 1);
    }
    requestAnimationFrame(frame);
  }
  if (!reduce) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
