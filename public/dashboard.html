<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — FLUX BOT ITA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="bg-glow"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <a href="/" class="side-brand"><span class="logo" data-logo></span><div><b>FLUX BOT ITA</b><small>pannello server</small></div></a>
    <nav class="side-nav" id="sideNav">
      <div class="side-label">MENU</div>
      <a href="#/overview" data-view="overview"><i>▦</i>Panoramica</a>
      <a href="#/controls" data-view="controls"><i>⚙</i>Controlli</a>
      <a href="#/bots" data-view="bots"><i>👥</i>Bot</a>
      <a href="#/activity" data-view="activity"><i>〰</i>Attività</a>
      <a href="#/settings" data-view="settings"><i>✦</i>Impostazioni</a>
      <div id="adminNav" hidden><div class="side-label">OWNER</div><a href="#/licenses" data-view="licenses"><i>🔑</i>Licenze</a></div>
      <div class="side-label">SISTEMA</div>
      <a href="/tutorial"><i>📖</i>Tutorial</a>
      <a href="#/status" data-view="status"><i>◉</i>Stato</a>
      <a href="#/discord" data-view="discord"><i>💬</i>Discord</a>
      <a href="/"><i>⌂</i>Home</a>
    </nav>
    <div class="side-user">
      <span id="avatarSlot"></span>
      <div class="who"><b id="userName"></b><small><i class="dot on" style="display:inline-block;width:6px;height:6px"></i> <span id="roleBadge"></span></small></div>
      <button class="icon-btn" id="logout" title="Esci">⎋</button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="burger" title="Menu">☰</button>
      <div class="crumb">Dashboard · <span class="badge" id="crumb">panoramica</span></div>
      <div class="status" style="margin-left:auto"><i class="dot"></i><span>servizi offline</span></div>
      <button class="icon-btn" data-theme-toggle title="Tema">☾</button>
      <a href="/tutorial" class="btn btn-ghost btn-sm">Guida all'installazione</a>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
