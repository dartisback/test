# ============================================================
#  RomaPD 2.0 - server.cfg
#  Sostituisci i valori <...> prima di avviare il server.
# ============================================================

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_hostname "RomaPD 2.0 | Italian Roleplay"
sets sv_projectName "RomaPD 2.0"
sets sv_projectDesc "Server Roleplay italiano - Polizia di Stato, Carabinieri, Croce Rossa"
sets locale "it-IT"
sets tags "roleplay, rp, italiano, ox, esx"
sv_maxclients 64
sv_enforceGameBuild 3095
set steam_webApiKey "<STEAM_API_KEY>"
sv_licenseKey "<CFX_LICENSE_KEY>"

# --- Database (oxmysql) ---
set mysql_connection_string "mysql://<utente>:<password>@localhost/romapd?charset=utf8mb4"

# --- ox_lib / ox_inventory ---
setr ox:locale "it"
setr ox:primaryColor "blue"
setr inventory:framework "esx"
setr inventory:slots 50
setr inventory:weight 30000

# --- ESX ---
setr esx:locale "it"

# --- Permessi (admin per Job Creator e comandi garage) ---
add_ace group.admin command allow
add_ace resource.es_extended command.add_ace allow
add_ace resource.es_extended command.add_principal allow
add_ace resource.es_extended command.remove_principal allow
add_ace resource.es_extended command.stop allow
# add_principal identifier.license:<LICENSE_DEL_TUO_ACCOUNT> group.admin

# ============================================================
#  Risorse (l'ordine conta)
# ============================================================
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure hardcap
ensure mapmanager

# Dipendenze (da scaricare: vedi README.md)
ensure oxmysql
ensure ox_lib
ensure es_extended
ensure ox_inventory

# Risorse RomaPD 2.0
ensure rp_f5menu
ensure rp_jobcreator
ensure rp_garage
